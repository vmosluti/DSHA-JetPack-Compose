android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
android.builtInKotlin=false
android.newDsl=false
android.suppressUnsupportedCompileSdk=37.0
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
# 手机内存有限（实测可用约 2 GB、swap 已用 5 GB）：6g 堆 + 6 路并行会把 dex 合并拖进 swap，看起来像卡死。
# 只保留一条 jvmargs（原文件两条，后者覆盖前者）。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.vfs.watch=false
android.r8.maxWorkers=2
